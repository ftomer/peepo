name: New level proposal
description: Pitch a scene before you build it
labels: ["level"]
body:
  - type: markdown
    attributes:
      value: |
        Levels are the most involved contribution, so it is worth agreeing the idea before you generate art.
        Read the Scene pipeline section of the README and the level checklist in CONTRIBUTING.md first.
  - type: input
    id: level-id
    attributes:
      label: Level id
      description: Lowercase with underscores, the folder name it will live under.
      placeholder: dinosaur_museum
    validations:
      required: true
  - type: textarea
    id: room
    attributes:
      label: The room
      description: What the child is looking at, and why it is fun to search.
    validations:
      required: true
  - type: textarea
    id: finds
    attributes:
      label: The find list
      description: The objects hidden in it, one per line. Aim for things a 5 year old can name.
    validations:
      required: true
  - type: dropdown
    id: dense
    attributes:
      label: Will it ship a dense variant for the 8-10 and 11-12 bands?
      options:
        - "Yes"
        - "No"
        - Not sure yet
  - type: checkboxes
    id: ack
    attributes:
      label: Before you start
      options:
        - label: The art will be generated by the pipeline in tools/, not sourced from anywhere else.
          required: true
        - label: I will add a music prompt to tools/audio_prompts.json and generate the track.
          required: true
